<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cây xanh đô thị Việt Nam — Dữ liệu theo phường 2025</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #86efac; border-radius: 3px; }

        #map { width: 100%; height: 100%; min-height: 420px; border-radius: 0.75rem; z-index: 1; }
        .map-wrap { position: relative; flex: 1; min-height: 420px; }

        @keyframes blink { 50% { opacity: 0; } }
        .is-typing { animation: blink 1s step-end infinite; }

        #search-wrapper:focus-within { box-shadow: 0 0 0 2px #bbf7d0; border-color: #86efac; background: #fff; }

        /* layer switch buttons */
        .layer-btn { transition: all 0.15s; }
        .layer-btn.active { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); color: #15803d; font-weight: 700; }
        .metric-btn.active { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); color: #15803d; font-weight: 700; }

        /* zoom hint */
        #zoom-hint {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.93); border: 1px solid #d1fae5;
            border-radius: 999px; padding: 3px 14px;
            font-size: 11px; font-weight: 600; color: #065f46;
            pointer-events: none; z-index: 500; white-space: nowrap;
            transition: opacity 0.3s;
        }

        /* ward detail SVG card */
        #ward-detail { transition: opacity 0.2s; }

        /* map overlay controls */
        #map-controls {
            position: absolute; top: 10px; left: 10px; z-index: 500;
            display: flex; flex-direction: column; gap: 6px;
            pointer-events: auto;
        }

        /* gallery */
        .gallery-card {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
            padding: 8px; cursor: pointer; transition: box-shadow 0.15s, transform 0.15s;
        }
        .gallery-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.10); transform: translateY(-2px); }
        .gallery-card svg { display: block; width: 100%; aspect-ratio: 1; }
        #gallery-view { display: flex; }
        #gallery-view.inactive { display: none; }

        #map-legend {
            margin-top: 0.4rem; padding: 0.5rem 0.75rem; border-radius: 0.5rem;
            border: 1px solid #e5e7eb; background: #f9fafb;
            font-size: 0.68rem; display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
        }
        .leg-sq { width: 28px; height: 7px; border-radius: 99px; flex-shrink: 0; }

        @media (max-width: 640px) {
            .hero-pad { padding: 1rem 1rem 0.75rem; }
            #map { min-height: 300px; }
        }
        @media (min-width: 769px) { .app-shell { height: 100vh; overflow: hidden; } }
        @media (max-width: 768px) { .app-shell { height: auto; overflow: auto; } .scroll-stack { overflow: visible; } }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex flex-col app-shell">

<div class="w-full flex-1 flex flex-col gap-3 px-2 md:px-4 py-3 overflow-hidden min-h-0 scroll-stack">

    <!-- ── HERO ── -->
    <header class="bg-white rounded-2xl shadow-sm border border-gray-200 shrink-0">
        <div class="px-4 pt-5 pb-4 md:px-8 hero-pad">
            <div class="flex flex-col items-center text-center gap-2 max-w-xl mx-auto">

                <h1 class="text-xl md:text-2xl font-extrabold text-gray-900 leading-tight">
                    Cây xanh đô thị tại
                    <span class="text-green-600 whitespace-nowrap">
                        <span id="animated-name">Việt Nam</span><span id="typing-cursor"
                            class="hidden w-0.5 h-5 md:h-6 bg-green-600 align-bottom inline-block ml-0.5"></span>
                    </span>
                </h1>

                <div class="flex flex-wrap gap-x-4 gap-y-0.5 justify-center text-xs sm:text-sm text-gray-500">
                    <span>Phủ xanh: <strong id="s-pct" class="text-green-700">—</strong></span>
                    <span>m²/người: <strong id="s-cap" class="text-green-700">—</strong></span>
                    <span>Dân số: <strong id="s-pop" class="text-gray-700">—</strong></span>
                    <span id="s-wards-wrap" class="hidden">Phường: <strong id="s-wards" class="text-gray-700">—</strong></span>
                </div>

                <p class="text-[10px] text-amber-600 bg-amber-50 border border-amber-100 rounded-full px-3 py-0.5 mt-0.5">
                    Chỉ bao gồm <b>687 phường đô thị</b> thuộc 34 tỉnh/thành. Khu vực nông thôn không có dữ liệu.
                </p>

                <!-- view toggle: map vs gallery -->
                <div class="inline-flex bg-gray-100 p-0.5 rounded-lg mt-1">
                    <button id="view-map-btn" class="view-mode-btn px-3 py-1.5 rounded-md text-xs font-semibold text-gray-400 hover:text-gray-600 transition-all" data-view="map">
                        🗺 Bản đồ
                    </button>
                    <button id="view-gallery-btn" class="view-mode-btn active px-3 py-1.5 rounded-md text-xs font-semibold text-green-600 bg-white shadow-sm transition-all" data-view="gallery">
                        🌿 Thư viện phường
                    </button>
                </div>

                <!-- search -->
                <div class="relative w-full max-w-md z-20 mt-1">
                    <div id="search-wrapper" class="relative bg-gray-50 border-2 border-gray-200 rounded-xl transition-all">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
                            </svg>
                        </div>
                        <input id="ward-search" type="text" disabled
                            class="w-full pl-9 pr-9 py-2.5 bg-transparent font-medium placeholder-gray-400 focus:outline-none text-sm"
                            placeholder="Tìm phường hoặc tỉnh/thành phố..." autocomplete="off"/>
                        <button id="clear-search" type="button"
                            class="hidden text-gray-400 hover:text-green-500 absolute top-1/2 right-3 -translate-y-1/2">
                            <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                        <div id="suggestions" class="absolute top-full left-[-2px] right-[-2px] mt-1 bg-white rounded-b-xl shadow-xl max-h-52 overflow-y-auto hidden z-30 text-left"></div>
                    </div>
                </div>

            </div>
        </div>
    </header>

    <!-- ── GALLERY VIEW ── -->
    <div id="gallery-view" class="flex-col gap-3 flex-1 overflow-hidden min-h-0">
        <!-- gallery toolbar -->
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm shrink-0 px-4 py-3 flex flex-wrap gap-2 items-center">
            <input id="gallery-search" type="search" placeholder="Tìm phường..."
                class="border border-gray-200 bg-gray-50 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-green-400 w-36"/>
            <select id="gallery-prov" class="border border-gray-200 bg-gray-50 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-green-400 max-w-[180px]">
                <option value="">Tất cả tỉnh/thành</option>
            </select>
            <select id="gallery-sort" class="border border-gray-200 bg-gray-50 rounded-lg px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-green-400">
                <option value="green_pct_asc">% Xanh ↑ (ít nhất)</option>
                <option value="green_pct_desc">% Xanh ↓ (nhiều nhất)</option>
                <option value="green_per_capita_desc">m²/người ↓</option>
                <option value="green_per_capita_asc">m²/người ↑</option>
                <option value="name_asc">Tên A→Z</option>
            </select>
            <span id="gallery-count" class="text-xs text-gray-400 ml-1"></span>
            <div class="ml-auto flex gap-1.5">
                <button id="gallery-prev" class="px-2.5 py-1.5 rounded-lg border text-xs hover:bg-gray-50 disabled:opacity-30">‹ Trước</button>
                <span id="gallery-page" class="px-2 py-1.5 text-xs text-gray-500 self-center"></span>
                <button id="gallery-next" class="px-2.5 py-1.5 rounded-lg border text-xs hover:bg-gray-50 disabled:opacity-30">Sau ›</button>
            </div>
        </div>
        <!-- gallery grid -->
        <div class="flex-1 overflow-y-auto custom-scrollbar">
            <div id="gallery-grid" class="grid gap-3 p-1"
                style="grid-template-columns: repeat(auto-fill, minmax(130px, 1fr))"></div>
        </div>
    </div>

    <!-- ── MAIN GRID ── -->
    <div class="main-grid flex-1 overflow-hidden min-h-0" style="display:none">

        <!-- MAP CARD -->
        <section class="bg-white px-3 py-3 rounded-2xl shadow-sm border border-gray-200 flex flex-col h-full overflow-hidden min-h-0">

            <!-- map header -->
            <div class="flex items-center justify-between mb-2 px-1">
                <h3 id="map-title" class="text-sm md:text-base font-bold text-gray-800">Bản đồ phủ xanh theo phường</h3>
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-green-100 text-green-700">687 phường đô thị</span>
            </div>

            <div class="map-wrap flex-1 min-h-0">
                <div id="map"></div>
                <div id="zoom-hint">Phóng to để xem từng phường</div>
                <!-- map overlay controls -->
                <div id="map-controls">
                    <div class="inline-flex bg-white/90 backdrop-blur p-0.5 rounded-lg shadow-sm border border-gray-200">
                        <button class="metric-btn active px-2.5 py-1 rounded-md text-[11px] font-semibold text-green-700 transition-all" data-metric="green_pct">% Phủ xanh</button>
                        <button class="metric-btn px-2.5 py-1 rounded-md text-[11px] font-semibold text-gray-400 hover:text-gray-600 transition-all" data-metric="green_per_capita">m²/người</button>
                    </div>
                    <div class="flex items-center gap-2 bg-white/90 backdrop-blur px-2.5 py-1.5 rounded-lg shadow-sm border border-gray-200">
                        <span style="font-size:10px;color:#6b7280;white-space:nowrap">Độ trong</span>
                        <input id="opacity-slider" type="range" min="10" max="100" value="82"
                            class="w-20 accent-green-600" style="height:4px"/>
                        <span id="opacity-val" style="font-size:10px;font-weight:600;color:#15803d;min-width:2.5em">82%</span>
                    </div>
                </div>
            </div>
            <div id="map-legend"></div>
        </section>

    </div><!-- end grid -->
</div><!-- end outer -->

<script>
document.addEventListener('DOMContentLoaded', async () => {

// ─── CONFIG ─────────────────────────────────────────────────────────────────
const METRICS = {
    green_pct: {
        label: '% Phủ xanh',
        format: v => v.toFixed(1) + '%',
        colors: [
            { max: 10,      color: '#dc2626', label: '0–10%' },
            { max: 20,      color: '#f97316', label: '10–20%' },
            { max: 35,      color: '#fbbf24', label: '20–35%' },
            { max: 55,      color: '#86efac', label: '35–55%' },
            { max: 75,      color: '#22c55e', label: '55–75%' },
            { max: 9999,    color: '#15803d', label: '75%+' },
        ]
    },
    green_per_capita: {
        label: 'm²/người',
        format: v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v.toFixed(0),
        colors: [
            { max: 9,       color: '#dc2626', label: '<9 (WHO)' },
            { max: 25,      color: '#f97316', label: '9–25' },
            { max: 75,      color: '#fbbf24', label: '25–75' },
            { max: 200,     color: '#86efac', label: '75–200' },
            { max: 1000,    color: '#22c55e', label: '200–1k' },
            { max: 9999999, color: '#15803d', label: '1k+' },
        ]
    }
};

const getColor = (val, metric) => {
    const cfg = METRICS[metric].colors;
    return (cfg.find(c => val <= c.max) || cfg[cfg.length-1]).color;
};

const fmtN    = v  => Number.isFinite(+v) ? (+v).toLocaleString('vi-VN') : '—';
const fmtHA   = ha => ha >= 100 ? Math.round(ha) + ' ha' : ha.toFixed(1) + ' ha';
const shortProv = p => p.replace(/^(thành phố|thủ đô|tỉnh)\s+/i, '');
const wardKey   = (ward, prov) => prov.toLowerCase() + '||' + ward.toLowerCase();
const debounce  = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const esc       = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
const fmtCap    = (pop, cap) => pop > 0 ? fmtN(cap) : '—';

// ─── STATE ───────────────────────────────────────────────────────────────────
const S = {
    map: null, wardLayer: null,
    wardData: null, svgData: null,
    currentMetric: 'green_pct',
    fillOpacity: 0.82,
    wardRanking: [],
    userInteracted: false,
    animId: null, typingId: null,
    allBounds: null,
    highlightedLayer: null,
    wardFeatureMap: new Map(),
    suggestionSource: [],
};

// ─── DOM ─────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const el = {
    search: $('ward-search'), suggestions: $('suggestions'), clearBtn: $('clear-search'),
    animName: $('animated-name'), typingCursor: $('typing-cursor'),
    sPct: $('s-pct'), sCap: $('s-cap'), sPop: $('s-pop'),
    sWardsWrap: $('s-wards-wrap'), sWards: $('s-wards'),
    mapTitle: $('map-title'), mapLegend: $('map-legend'), zoomHint: $('zoom-hint'),
    metricBtns: document.querySelectorAll('.metric-btn'),
};

// ─── INIT ────────────────────────────────────────────────────────────────────
async function init() {
    const [wardRes, svgRes] = await Promise.all([
        fetch('./ward_green.geojson'),
        fetch('./ward_svgs.json'),
    ]);
    S.wardData = await wardRes.json();
    S.svgData  = await svgRes.json();

    S.wardData.features.forEach(f => {
        const p = f.properties;
        S.wardRanking.push(p);
        S.suggestionSource.push({
            label: p.ward + ' — ' + shortProv(p.province),
            norm: (p.ward + ' ' + p.province).toLowerCase(),
            key: wardKey(p.ward, p.province)
        });
    });

    S.wardRanking.sort((a, b) => a.green_pct - b.green_pct); // worst → best

    setupMap();
    renderLegend();
    setupEvents();
    startAnimation();
    el.search.disabled = false;
    initGallery();
}

// ─── MAP ─────────────────────────────────────────────────────────────────────
function setupMap() {
    S.map = L.map('map', { attributionControl: false, zoomControl: false })
              .setView([10.78, 106.66], 12);
    L.control.zoom({ position: 'bottomright' }).addTo(S.map);
    L.tileLayer('https://mt.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}&hl=vi', { maxZoom: 18 })
     .addTo(S.map);

    S.wardLayer = L.geoJSON(S.wardData, {
        style: f => wardStyle(f.properties[S.currentMetric]),
        onEachFeature: (f, l) => {
            const p = f.properties;
            S.wardFeatureMap.set(wardKey(p.ward, p.province), l);
            l.bindTooltip(wardTooltip(p), { sticky: true });
            l.on('click', () => selectWard(wardKey(p.ward, p.province), true));
            l.on('mouseover', () => { if (l !== S.highlightedLayer) l.setStyle({ weight: 2, opacity: 1 }); });
            l.on('mouseout',  () => { if (l !== S.highlightedLayer) S.wardLayer.resetStyle(l); });
        }
    }).addTo(S.map);

    S.allBounds = S.wardLayer.getBounds();
    // default view: HCMC; allBounds kept for "reset" action
    setTimeout(() => S.map.invalidateSize(), 100);
    updateZoomHint();
    S.map.on('zoomend', updateZoomHint);
}

const wardStyle = val => ({
    color: '#fff', weight: 0.6, opacity: 0.6,
    fillColor: getColor(val, S.currentMetric), fillOpacity: S.fillOpacity
});

const wardTooltip = p => `
    <div style="font-size:12px;line-height:1.5">
        <b>${p.ward}</b>
        <div style="font-size:10px;color:#888">${shortProv(p.province)}</div>
        <div style="font-size:11px;color:#555;margin-top:2px">Phủ xanh: <b>${p.green_pct.toFixed(1)}%</b>${p.population > 0 ? ` · ${fmtN(p.green_per_capita)} m²/ng` : ''}</div>
        <div style="font-size:10px;color:#888">${fmtN(p.population)} dân</div>
    </div>`;

function updateZoomHint() {
    const z = S.map.getZoom();
    if (z < 9) {
        el.zoomHint.textContent = 'Phóng to để xem từng phường rõ hơn';
        el.zoomHint.style.opacity = '1';
    } else {
        el.zoomHint.textContent = 'Click vào phường để xem chi tiết';
        el.zoomHint.style.opacity = '0.7';
    }
}

function updateMapColors() {
    if (!S.wardLayer) return;
    S.wardLayer.setStyle(f => wardStyle(f.properties[S.currentMetric]));
    if (S.highlightedLayer)
        S.highlightedLayer.setStyle({ color: '#14532d', weight: 2.5, opacity: 1, fillOpacity: 0.9 });
}

// ─── WARD SELECTION ──────────────────────────────────────────────────────────
function selectWard(key, isUser = false) {
    const layer = S.wardFeatureMap.get(key);
    if (!layer) return;
    const p = layer.feature.properties;

    if (isUser) {
        S.userInteracted = true;
        stopAnimation();
        el.search.value = p.ward;
        el.clearBtn.classList.remove('hidden');
        el.suggestions.classList.add('hidden');
        el.animName.textContent = p.ward + ', ' + shortProv(p.province);
        el.typingCursor.classList.remove('is-typing');
    } else {
        animateTyping(p.ward);
    }

    el.sPct.textContent = p.green_pct.toFixed(1) + '%';
    el.sCap.textContent = fmtCap(p.population, p.green_per_capita);
    el.sPop.textContent = fmtN(p.population);
    el.sWardsWrap.classList.add('hidden');

    // Map highlight
    if (S.highlightedLayer) S.wardLayer.resetStyle(S.highlightedLayer);
    layer.setStyle({ color: '#14532d', weight: 2.5, opacity: 1, fillOpacity: 0.9 });
    layer.bringToFront();
    S.highlightedLayer = layer;

    if (isUser) {
        S.map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 15 });
    }
}


// ─── SEARCH ──────────────────────────────────────────────────────────────────
function showSuggestions(q) {
    q = q.toLowerCase().trim();
    if (!q) { el.suggestions.classList.add('hidden'); return; }
    const matches = S.suggestionSource.filter(s => s.norm.includes(q)).slice(0, 10);
    if (!matches.length) { el.suggestions.classList.add('hidden'); return; }
    el.suggestions.innerHTML = matches.map(s =>
        `<div class="px-4 py-2 cursor-pointer hover:bg-green-50 border-b border-gray-50 text-sm suggestion-item"
             data-key="${esc(s.key)}">
            📍 <span class="font-semibold">${s.label}</span>
        </div>`
    ).join('');
    el.suggestions.classList.remove('hidden');
}

// ─── ANIMATION ───────────────────────────────────────────────────────────────
function animateTyping(text) {
    clearInterval(S.typingId);
    el.animName.textContent = '';
    el.typingCursor.classList.add('is-typing');
    let i = 0;
    S.typingId = setInterval(() => {
        if (i < text.length) el.animName.textContent += text.charAt(i++);
        else clearInterval(S.typingId);
    }, 45);
}

function startAnimation() {
    if (S.userInteracted) return;
    let idx = 0;
    const cycle = () => {
        if (S.userInteracted) return;
        const d = S.wardRanking[idx % S.wardRanking.length];
        el.sPct.textContent = d.green_pct.toFixed(1) + '%';
        el.sCap.textContent = fmtCap(d.population, d.green_per_capita);
        el.sPop.textContent = fmtN(d.population);
        animateTyping(d.ward);
        idx++;
        S.animId = setTimeout(cycle, 2800);
    };
    S.animId = setTimeout(cycle, 600);
}

function stopAnimation() {
    clearTimeout(S.animId);
    clearInterval(S.typingId);
    el.typingCursor.classList.remove('is-typing');
}

// ─── LEGEND ──────────────────────────────────────────────────────────────────
function renderLegend() {
    const cfg = METRICS[S.currentMetric].colors;
    el.mapLegend.innerHTML = `
        <span style="font-size:11px;font-weight:600;color:#6b7280">${METRICS[S.currentMetric].label}</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center">
            ${cfg.map(c => `<div style="display:flex;align-items:center;gap:4px">
                <div class="leg-sq" style="background:${c.color}"></div>
                <span>${c.label}</span>
            </div>`).join('')}
        </div>
        <span style="font-size:10px;color:#9ca3af;margin-left:auto">WHO ≥ 9 m²/ng</span>`;
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
function setupEvents() {
    // Metric toggle (in map overlay)
    el.metricBtns.forEach(btn => btn.addEventListener('click', () => {
        S.currentMetric = btn.dataset.metric;
        el.metricBtns.forEach(b => {
            b.classList.toggle('active', b === btn);
            b.classList.toggle('text-green-700', b === btn);
            b.classList.toggle('text-gray-400', b !== btn);
        });
        updateMapColors();
        renderLegend();
        el.mapTitle.textContent = S.currentMetric === 'green_pct'
            ? 'Bản đồ phủ xanh theo phường'
            : 'Bản đồ m²/người theo phường';
    }));

    // Opacity slider
    const slider = $('opacity-slider');
    const opVal  = $('opacity-val');
    slider.addEventListener('input', () => {
        S.fillOpacity = slider.value / 100;
        opVal.textContent = slider.value + '%';
        updateMapColors();
    });

    // Search
    const debouncedSuggest = debounce(showSuggestions, 150);
    el.search.addEventListener('input', e => {
        debouncedSuggest(e.target.value);
        el.clearBtn.classList.toggle('hidden', !e.target.value);
    });

    el.suggestions.addEventListener('click', e => {
        const item = e.target.closest('.suggestion-item');
        if (!item) return;
        el.suggestions.classList.add('hidden');
        el.search.value = '';
        el.clearBtn.classList.add('hidden');
        selectWard(item.dataset.key, true);
    });

    el.clearBtn.addEventListener('click', () => {
        el.search.value = '';
        el.clearBtn.classList.add('hidden');
        el.suggestions.classList.add('hidden');
        if (S.highlightedLayer) {
            S.wardLayer.resetStyle(S.highlightedLayer);
            S.highlightedLayer = null;
        }
        S.map.setView([10.78, 106.66], 12);
        S.userInteracted = false;
        el.animName.textContent = 'Việt Nam';
        el.sPct.textContent = el.sCap.textContent = el.sPop.textContent = '—';
        startAnimation();
    });

    document.addEventListener('click', e => {
        if (!e.target.closest('#search-wrapper')) el.suggestions.classList.add('hidden');
    });
}

// ─── GALLERY ─────────────────────────────────────────────────────────────────
const G = { data: [], page: 1, perPage: 60 };

function initGallery() {
    const provSel = $('gallery-prov');
    const provs = [...new Set(S.wardRanking.map(d => d.province))].sort((a,b) => a.localeCompare(b,'vi'));
    provs.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = shortProv(p);
        provSel.appendChild(opt);
    });

    $('gallery-search').addEventListener('input', debounce(applyGalleryFilters, 180));
    $('gallery-prov').addEventListener('change', applyGalleryFilters);
    $('gallery-sort').addEventListener('change', applyGalleryFilters);
    $('gallery-prev').addEventListener('click', () => { G.page--; renderGallery(); });
    $('gallery-next').addEventListener('click', () => { G.page++; renderGallery(); });
    $('gallery-grid').addEventListener('click', e => {
        const card = e.target.closest('.gallery-card');
        if (!card) return;
        switchToMapView();
        selectWard(card.dataset.key, true);
    });

    applyGalleryFilters();
}

function applyGalleryFilters() {
    const q    = $('gallery-search').value.toLowerCase().trim();
    const prov = $('gallery-prov').value;
    const sort = $('gallery-sort').value;

    let data = [...S.wardRanking];
    if (q)    data = data.filter(d => d.ward.toLowerCase().includes(q) || d.province.toLowerCase().includes(q));
    if (prov) data = data.filter(d => d.province === prov);

    const sortKey2 = sort.replace(/_asc$|_desc$/, '');
    const sortDir2 = sort.endsWith('asc') ? 'asc' : 'desc';
    data.sort((a, b) => {
        const va = sortKey2 === 'name' ? a.ward : a[sortKey2];
        const vb = sortKey2 === 'name' ? b.ward : b[sortKey2];
        if (typeof va === 'string') return sortDir2 === 'asc' ? va.localeCompare(vb,'vi') : vb.localeCompare(va,'vi');
        return sortDir2 === 'asc' ? va - vb : vb - va;
    });

    G.data = data; G.page = 1;
    renderGallery();
}

function renderGallery() {
    const total = Math.ceil(G.data.length / G.perPage) || 1;
    if (G.page > total) G.page = total;
    if (G.page < 1) G.page = 1;
    const slice = G.data.slice((G.page-1)*G.perPage, G.page*G.perPage);
    const grid = $('gallery-grid');

    grid.innerHTML = slice.map(d => {
        const key = wardKey(d.ward, d.province);
        const sv  = S.svgData[key];
        const svgHtml = sv
            ? `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" fill="#f1f5f9"/>
                <path d="${sv.d}" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.6"/>
                <path d="${sv.d}" fill="${sv.c}" fill-opacity="${sv.o}" stroke="none"/>
               </svg>`
            : `<div style="aspect-ratio:1;background:#f1f5f9"></div>`;

        const badge = getColor(d.green_pct, 'green_pct');
        return `<div class="gallery-card" data-key="${esc(key)}" title="${esc(d.ward)}, ${esc(shortProv(d.province))}">
            ${svgHtml}
            <div style="margin-top:5px">
                <div style="font-size:11px;font-weight:700;color:#111;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.ward}</div>
                <div style="font-size:9px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${shortProv(d.province)}</div>
                <div style="margin-top:3px;display:flex;align-items:center;gap:3px">
                    <span style="background:${badge};color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px">${d.green_pct.toFixed(1)}%</span>
                    ${d.population > 0 ? `<span style="font-size:9px;color:#6b7280">${fmtN(d.green_per_capita)} m²</span>` : ''}
                </div>
            </div>
        </div>`;
    }).join('');

    $('gallery-count').textContent = `${G.data.length} phường`;
    $('gallery-page').textContent  = `${G.page} / ${total}`;
    $('gallery-prev').disabled = G.page <= 1;
    $('gallery-next').disabled = G.page >= total;
}

// ─── VIEW SWITCHING ───────────────────────────────────────────────────────────
const mainGrid   = document.querySelector('.main-grid');
const galleryDiv = $('gallery-view');

function setViewBtn(activeView) {
    document.querySelectorAll('.view-mode-btn').forEach(b => {
        const on = b.dataset.view === activeView;
        b.classList.toggle('active', on);
        b.classList.toggle('text-green-600', on);
        b.classList.toggle('bg-white', on);
        b.classList.toggle('shadow-sm', on);
        b.classList.toggle('text-gray-400', !on);
    });
}

function switchToMapView() {
    galleryDiv.classList.add('inactive');
    mainGrid.style.display = '';
    setViewBtn('map');
    setTimeout(() => S.map && S.map.invalidateSize(), 100);
}

function switchToGalleryView() {
    mainGrid.style.display = 'none';
    galleryDiv.classList.remove('inactive');
    setViewBtn('gallery');
}

document.querySelectorAll('.view-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        if (btn.dataset.view === 'gallery') switchToGalleryView();
        else switchToMapView();
    });
});

init().catch(err => {
    console.error('Init failed:', err);
    document.getElementById('map').innerHTML =
        `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#dc2626;font-size:14px;padding:20px;text-align:center">
            Lỗi tải dữ liệu.<br><code style="font-size:11px;color:#999">${err.message}</code><br><br>
            Chạy <code>python3 -m http.server</code> trong thư mục dự án rồi mở <code>http://localhost:8000</code>
        </div>`;
});

}); // DOMContentLoaded
</script>
